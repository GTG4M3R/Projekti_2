<!DOCTYPE html>
<html lang="fi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Projekti 2 - Junien lähdöt</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body> 
  <div class="container">
    <h1>Junien lähdöt</h1>

    <div class="controls">
      <label for="station-select">Asema:</label>
      <select id="station-select">
        <option value="HKI">Helsinki</option>
        <option value="PSL">Pasila</option>
        <option value="TKL" selected>Tikkurila</option>
        <option value="LPV">Leppävaara</option>
      </select>

      <button id="search-btn">Näytä lähdöt</button>

      <span class="updated-time" id="updated-time">Päivitetty --.--</span>
    </div>

    <table>
      <thead>
        <tr>
          <th>Lähtöaika</th>
          <th>Juna</th>
          <th>Määränpää</th>
          <th>Raide</th>
        </tr>
      </thead>
     <tbody id="timetable-body">
  <tr><td>12.45</td><td>Z</td><td class="destination">Lahti</td><td>4</td></tr>
  <tr><td>12.47</td><td>I</td><td class="destination">Lentoasema</td><td>5</td></tr>
  <tr><td>12.50</td><td>K</td><td class="destination">Kerava</td><td>5</td></tr>
  <tr><td>12.51</td><td>R</td><td class="destination">Järvenpää</td><td>4</td></tr>
  <tr><td>12.55</td><td>P</td><td class="destination">Helsinki</td><td>6</td></tr>
  <tr><td>12.57</td><td>IC28</td><td class="destination">Helsinki</td><td>1</td></tr>
</tbody>
    </table>
  </div>

  <script src="js/script.js"></script>
</body>
</html>
