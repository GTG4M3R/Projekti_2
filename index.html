<!DOCTYPE html>
<html lang="fi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Projekti 2 - Junien lähdöt</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body> 
  <div class="container">
    <h1>Junien lähdöt</h1>

    <div class="controls">
      <label for="station-select">Asema:</label>
      <select id="station-select">
        <option value="HKI">Helsinki</option>
        <option value="PSL">Pasila</option>
        <option value="TKL" selected>Tikkurila</option>
        <option value="LPV">Leppävaara</option>
      </select>

      <button id="search-btn">Näytä lähdöt</button>

      <span class="updated-time" id="updated-time">Päivitetty --.--</span>
    </div>

    <table>
      <thead>
        <tr>
          <th>Lähtöaika</th>
          <th>Juna</th>
          <th>Määränpää</th>
          <th>Raide</th>
        </tr>
      </thead>
     <tbody id="timetable-body"></tbody>
    </table>
  </div>

  <script src="js/script.js"></script>
</body>
</html>
